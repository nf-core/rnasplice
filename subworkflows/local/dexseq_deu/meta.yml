# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "dexseq_deu"
description: Prepare a DEXSeq exon annotation from a GTF, count reads per exonic part in each sample and test for differential exon usage
keywords:
  - dexseq
  - deu
  - differential exon usage
  - splicing
  - htseq
components:
  - dexseq/prepareannotation
  - dexseq/count
  - dexseq/exon
input:
  - gtf:
      type: file
      description: |
        The input channel containing the GTF annotation flattened into DEXSeq exonic parts.
        Only used when `skip_annotation` is false
        Structure: [ path(gtf) ]
      pattern: "*.gtf"
  - ch_genome_bam:
      type: file
      description: |
        The input channel containing the genome BAM files to count reads from
        Structure: [ val(meta), path(bam) ]
      pattern: "*.bam"
  - ch_dexseq_gff:
      type: file
      description: |
        The input channel containing a user supplied DEXSeq GFF annotation. Must be an empty
        channel when `skip_annotation` is false
        Structure: [ path(gff) ]
      pattern: "*.gff"
  - skip_annotation:
      type: boolean
      description: |
        Whether to use the annotation supplied through `ch_dexseq_gff`. When false, `gtf` is
        flattened into a DEXSeq annotation with `DEXSEQ_PREPAREANNOTATION` instead
        Structure: [ val(skip_annotation) ]
  - ch_samplesheet:
      type: file
      description: |
        The input channel containing the samplesheet, which assigns each sample to a condition
        Structure: [ path(samplesheet) ]
      pattern: "*.csv"
  - ch_contrastsheet:
      type: map
      description: |
        The input channel containing the parsed contrastsheet, one row per contrast.
        `DEXSEQ_EXON` runs once per contrast, with the contrast name as its id
        Structure: [ contrast: val(contrast), treatment: val(condition), control: val(condition) ]
output:
  - dexseq_clean_txt:
      type: file
      description: |
        Channel containing the per sample exon count tables, collected across samples
        Structure: [ path(counts) ]
      pattern: "*.txt"
  - dexseq_exon_dataset_rds:
      type: file
      description: |
        Channel containing the `DEXSeqDataSet` objects, one per contrast
        Structure: [ val(meta), path(rds) ]
      pattern: "*.dexseq.dataset.rds"
  - dexseq_exon_results_rds:
      type: file
      description: |
        Channel containing the exon level `DEXSeqResults` objects, one per contrast
        Structure: [ val(meta), path(rds) ]
      pattern: "*.dexseq.results.rds"
  - dexseq_gene_results_rds:
      type: file
      description: |
        Channel containing the gene level q-values, one per contrast
        Structure: [ val(meta), path(rds) ]
      pattern: "*.dexseq.gene_qvalues.rds"
  - dexseq_exon_results_tsv:
      type: file
      description: |
        Channel containing the exon level results as TSV, one per contrast
        Structure: [ val(meta), path(tsv) ]
      pattern: "*.dexseq.results.tsv"
  - dexseq_gene_results_tsv:
      type: file
      description: |
        Channel containing the gene level q-values as TSV, one per contrast
        Structure: [ val(meta), path(tsv) ]
      pattern: "*.dexseq.gene_qvalues.tsv"
  - dexseq_plot_results_pdf:
      type: file
      description: |
        Channel containing the DEXSeq plots of the top significant genes, one PDF per contrast
        Structure: [ val(meta), path(pdf) ]
      pattern: "*.dexseq.plots.pdf"
authors:
  - "@bensouthgate"
  - "@jma1991"
  - "@valentinoruggieri"
  - "@piplus2"
maintainers:
  - "@piplus2"
