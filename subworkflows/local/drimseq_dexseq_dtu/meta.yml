# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "drimseq_dexseq_dtu"
description: Filter a tximport transcript quantification with DRIMSeq, test for differential transcript usage with DEXSeq and stage the results with stageR
keywords:
  - drimseq
  - dexseq
  - stager
  - geneannotation/annotate
  - dtu
  - differential transcript usage
  - splicing
components:
  - drimseq/dmfilter
  - dexseq/dtu
  - stager
input:
  - counts:
      type: file
      description: |
        The input channel containing the tximport transcript counts, either scaled TPM
        (`transcript_counts_scaled.tsv`) or DTU scaled TPM (`transcript_counts_dtu_scaled.tsv`)
        Structure: [ path(tsv) ]
      pattern: "*transcript_counts*scaled.tsv"
  - samplesheet:
      type: file
      description: |
        The input channel containing the samplesheet, which assigns each sample to a condition
        Structure: [ path(samplesheet) ]
      pattern: "*.csv"
  - ch_contrastsheet:
      type: map
      description: |
        The input channel containing the parsed contrastsheet, one row per contrast.
        `DEXSEQ_DTU` runs once per contrast, with the contrast name as its id. The optional
        blocking holds samplesheet columns to adjust for, separated by semicolons
        Structure: [ contrast: val(contrast), treatment: val(condition), control: val(condition), blocking: val(columns) ]
  - ch_gene_annotation:
      type: file
      description: |
        The input channel containing the gene annotation table of `GENEANNOTATION_TABLES`,
        as a value channel, that the annotated copies of the results tables are made from
        Structure: [ val(meta), path(tsv) ]
      pattern: "*.gene_annotation.tsv"
output:
  - drimseq_dataset_rds:
      type: file
      description: |
        Channel containing the filtered `dmDSdata` object
        Structure: [ path(rds) ]
      pattern: "dmDSdata.rds"
  - drimseq_samples_tsv:
      type: file
      description: |
        Channel containing the sample data of the filtered `dmDSdata` object
        Structure: [ path(tsv) ]
      pattern: "samples.tsv"
  - drimseq_counts_tsv:
      type: file
      description: |
        Channel containing the transcript counts of the filtered `dmDSdata` object
        Structure: [ path(tsv) ]
      pattern: "counts.tsv"
  - dexseq_exon_dataset_rds:
      type: file
      description: |
        Channel containing the `DEXSeqDataSet` objects, one per contrast
        Structure: [ val(meta), path(rds) ]
      pattern: "*.dexseq.dataset.rds"
  - dexseq_exon_results_rds:
      type: file
      description: |
        Channel containing the transcript level `DEXSeqResults` objects, one per contrast
        Structure: [ val(meta), path(rds) ]
      pattern: "*.dexseq.results.rds"
  - dexseq_exon_results_tsv:
      type: file
      description: |
        Channel containing the transcript level results as TSV, one per contrast
        Structure: [ val(meta), path(tsv) ]
      pattern: "*.dexseq.results.tsv"
  - dexseq_gene_results_rds:
      type: file
      description: |
        Channel containing the gene level q-values, one per contrast
        Structure: [ val(meta), path(rds) ]
      pattern: "*.dexseq.gene_qvalues.rds"
  - dexseq_gene_results_tsv:
      type: file
      description: |
        Channel containing the gene level q-values as TSV, one per contrast
        Structure: [ val(meta), path(tsv) ]
      pattern: "*.dexseq.gene_qvalues.tsv"
  - stager_rds:
      type: file
      description: |
        Channel containing the `stageRTx` objects, one per contrast
        Structure: [ val(meta), path(rds) ]
      pattern: "stageRTx.*.rds"
  - stager_padj_rds:
      type: file
      description: |
        Channel containing the stage wise adjusted p-values, one per contrast
        Structure: [ val(meta), path(rds) ]
      pattern: "getAdjustedPValues.*.rds"
  - stager_padj_tsv:
      type: file
      description: |
        Channel containing the stage wise adjusted p-values as TSV, one per contrast
        Structure: [ val(meta), path(tsv) ]
      pattern: "getAdjustedPValues.*.tsv"
  - dexseq_annotated_tsv:
      type: file
      description: |
        Channel containing copies of the transcript level results and gene level q-values
        with the gene name and biotype after `groupID`, two per contrast
        Structure: [ val(meta), path(tsv) ]
      pattern: "*.dexseq.{results,gene_qvalues}.annotated.tsv"
  - stager_padj_annotated_tsv:
      type: file
      description: |
        Channel containing a copy of the stageR adjusted p-values with the gene name and
        biotype after `geneID`, one per contrast
        Structure: [ val(meta), path(tsv) ]
      pattern: "getAdjustedPValues.*.annotated.tsv"
authors:
  - "@bensouthgate"
  - "@jma1991"
  - "@valentinoruggieri"
  - "@piplus2"
maintainers:
  - "@piplus2"
