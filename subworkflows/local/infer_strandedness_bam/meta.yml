# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "infer_strandedness_bam"
description: Infer the strandedness of the genome BAM samples set to 'auto' with RSeQC infer_experiment.py, using the thresholds of nf-core/rnaseq
keywords:
  - strandedness
  - library type
  - rseqc
  - bam
  - rnaseq
components:
  - rseqc/inferexperiment
input:
  - ch_bam_bai:
      type: file
      description: |
        The input channel containing the sorted genome BAM files and their indices. Samples
        whose `meta.strandedness` is 'auto' have it inferred, every other sample is passed
        through untouched
        Structure: [ val(meta), path(bam), path(bai) ]
      pattern: "*.{bam,bai}"
  - ch_bed:
      type: file
      description: |
        The BED12 gene model RSeQC compares the alignments with
        Structure: path(bed)
      pattern: "*.bed"
  - stranded_threshold:
      type: float
      description: |
        The fraction of stranded reads that must be assigned to a strand for the sample to
        be called forward or reverse
  - unstranded_threshold:
      type: float
      description: |
        The difference between the forward and reverse fractions below which the sample is
        called unstranded
output:
  - bam_bai:
      type: file
      description: |
        Channel containing the BAM files and indices of every sample, with the strandedness
        inferred for the 'auto' samples, which also carry the RSeQC fractions in
        `meta.rseqc_strand_analysis`. An undetermined sample is set to 'unstranded'
        Structure: [ val(meta), path(bam), path(bai) ]
      pattern: "*.{bam,bai}"
  - txt:
      type: file
      description: |
        Channel containing the RSeQC infer_experiment.py reports of the 'auto' samples
        Structure: [ val(meta), path(infer_experiment.txt) ]
      pattern: "*.infer_experiment.txt"
authors:
  - "@piplus2"
maintainers:
  - "@piplus2"
