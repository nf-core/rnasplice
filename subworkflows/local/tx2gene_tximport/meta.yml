# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "tx2gene_tximport"
description: Extract the Salmon results given as tarballs, merge the quantification of all samples with tximport into tables and SummarizedExperiment objects, and reshape the transcript TPM for SUPPA
keywords:
  - salmon
  - tximport
  - tx2gene
  - quantification
  - rna-seq
components:
  - untar
  - quant_tximport_summarizedexperiment
  - suppatpm
input:
  - ch_samplesheet:
      type: file
      description: |
        Channel containing the samplesheet, used as the colData of the SummarizedExperiment objects
        Structure: [ val(meta), path(csv) ]
      pattern: "*.csv"
  - ch_salmon_results:
      type: directory
      description: |
        Channel containing the Salmon results of each sample, as a directory or as a .tar.gz of one
        Structure: [ val(meta), path(results) ]
  - ch_gtf:
      type: file
      description: |
        Channel containing the GTF annotation
        Structure: path(gtf)
      pattern: "*.gtf"
  - gene_id:
      type: string
      description: |
        GTF attribute holding the gene ID
  - gene_extra:
      type: string
      description: |
        Comma-separated GTF attributes added to the transcript to gene table, e.g. the gene name
output:
  - salmon_results:
      type: directory
      description: |
        Channel containing the Salmon directory of each sample, extracted when the input was a tarball, with the meta map of the input
        Structure: [ val(meta), path(results) ]
  - counts_transcript_scaled:
      type: file
      description: |
        Channel containing the transcript counts of all samples, scaled to library size (scaledTPM)
        Structure: [ val(meta), path(tsv) ]
      pattern: "*transcript_counts_scaled.tsv"
  - counts_transcript_dtu_scaled:
      type: file
      description: |
        Channel containing the transcript counts of all samples, scaled for differential transcript usage (dtuScaledTPM)
        Structure: [ val(meta), path(tsv) ]
      pattern: "*transcript_counts_dtu_scaled.tsv"
  - suppa_tpm:
      type: file
      description: |
        Channel containing the transcript TPM of all samples in the format SUPPA reads
        Structure: path(txt)
      pattern: "suppa_tpm.txt"
authors:
  - "@bensouthgate"
  - "@jma1991"
  - "@piplus2"
maintainers:
  - "@piplus2"
