# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "edger_deu"
description: Flatten a GTF annotation into exonic features, count reads per feature in each sample, join the counts of all samples and test for differential exon usage with edgeR for each contrast
keywords:
  - edger
  - deu
  - differential exon usage
  - splicing
  - featurecounts
components:
  - subread/flattengtf
  - subread/featurecounts
  - csvtk/join
  - edger/diffsplice
  - geneannotation/annotate
input:
  - gtf:
      type: file
      description: |
        The input channel containing the GTF annotation to flatten into exonic features
        Structure: path(gtf)
      pattern: "*.gtf"
  - ch_genome_bam:
      type: file
      description: |
        The input channel containing the genome BAM files to count reads from. The `condition` key of the meta map
        assigns each sample to a condition, and the `strandedness` and `single_end` keys determine how `SUBREAD_FEATURECOUNTS` counts it
        Structure: [ val(meta), path(bam) ]
      pattern: "*.bam"
  - ch_contrastsheet:
      type: map
      description: |
        The input channel containing the parsed contrasts, one per item
        Structure: [ contrast, treatment, control ]
  - ch_gene_annotation:
      type: file
      description: |
        The input channel containing the gene annotation table of `GENEANNOTATION_TABLES`,
        as a value channel, that the annotated copies of the results tables are made from
        Structure: [ val(meta), path(tsv) ]
      pattern: "*.gene_annotation.tsv"
output:
  - featureCounts_counts:
      type: file
      description: |
        Channel containing the per sample exonic feature count tables
        Structure: [ val(meta), path(counts) ]
      pattern: "*.featureCounts.tsv"
  - featureCounts_summary:
      type: file
      description: |
        Channel containing the per sample featureCounts assignment summaries, which are
        collected for MultiQC
        Structure: [ val(meta), path(summary) ]
      pattern: "*.featureCounts.tsv.summary"
  - counts:
      type: file
      description: |
        Channel containing the exonic feature counts of all samples, joined into one table
        Structure: [ val(meta), path(tsv) ]
      pattern: "edger_exon.tsv"
  - expression:
      type: file
      description: |
        Channel containing the differential expression test of each exon, per contrast
        Structure: [ val(meta), path(tsv) ]
      pattern: "*.edger.diffsplice.expression.tsv"
  - results:
      type: file
      description: |
        Channel containing the feature-level differential exon usage results of each contrast
        Structure: [ val(meta), path(tsv) ]
      pattern: "*.edger.diffsplice.results.tsv"
  - simes:
      type: file
      description: |
        Channel containing the gene-level results of each contrast, combined with Simes' method
        Structure: [ val(meta), path(tsv) ]
      pattern: "*.edger.diffsplice.simes.tsv"
  - gene:
      type: file
      description: |
        Channel containing the gene-level F or likelihood ratio test results of each contrast
        Structure: [ val(meta), path(tsv) ]
      pattern: "*.edger.diffsplice.gene.tsv"
  - plots:
      type: file
      description: |
        Channel containing the plotSpliceDGE plots of the top genes of each contrast
        Structure: [ val(meta), path(pdf) ]
      pattern: "*.edger.diffsplice.pdf"
  - bcv_plot:
      type: file
      description: |
        Channel containing the biological coefficient of variation plot of each contrast
        Structure: [ val(meta), path(png) ]
      pattern: "*.edger.bcv.png"
  - rdata:
      type: file
      description: |
        Channel containing the fitted DGEGLM object of each contrast
        Structure: [ val(meta), path(rds) ]
      pattern: "*.DGEGLM.edger.rds"
  - lrt:
      type: file
      description: |
        Channel containing the DGELRT object of diffSpliceDGE of each contrast
        Structure: [ val(meta), path(rds) ]
      pattern: "*.DGELRT.edger.rds"
  - annotated:
      type: file
      description: |
        Channel containing copies of the results tables with the gene name and biotype after the gene ID, one table per item
        Structure: [ val(meta), path(tsv) ]
      pattern: "*.annotated.tsv"
authors:
  - "@bensouthgate"
  - "@jma1991"
  - "@valentinoruggieri"
  - "@piplus2"
maintainers:
  - "@piplus2"
