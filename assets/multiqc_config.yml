report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/rnasplice/releases/tag/2.0.0" target="_blank">nf-core/rnasplice</a> analysis pipeline. For information about how to interpret these results, please see the <a href="https://nf-co.re/rnasplice/2.0.0/docs/output" target="_blank">documentation</a>.
report_section_order:
  "nf-core-rnasplice-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-rnasplice-summary":
    order: -1002

export_plots: true
disable_version_detection: true

# Order of modules
top_modules:
  - "fail_trimmed_samples"

# Order of modules
module_order:
  - fastqc
  - trim_galore
  - fail_trimmed_samples
  - star
  - salmon
  - featurecounts
  - samtools

custom_data:
  fail_trimmed_samples:
    section_name: "WARNING: Fail Trimming Check"
    description: "List of samples that failed the minimum trimmed reads threshold specified via the '--min_trimmed_reads' parameter. These samples have still been used downstream but should be examined further."
    plot_type: "table"
    pconfig:
      id: "fail_trimmed_samples_table"
      table_title: "Samples failed trimming threshold"
      namespace: "Samples failed trimming threshold"
      format: "{:.0f}"
