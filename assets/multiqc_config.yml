report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/rnasplice/tree/dev" target="_blank">nf-core/rnasplice</a> analysis pipeline. For information about how to interpret these results, please see the <a href="https://nf-co.re/rnasplice/dev/docs/output" target="_blank">documentation</a>.
report_section_order:
  "nf-core-rnasplice-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-rnasplice-summary":
    order: -1002

export_plots: true
disable_version_detection: true

# Order of modules
top_modules:
  - "fail_trimmed_samples"
  - "fail_strand_check"

# Order of modules
module_order:
  - fastqc
  - trim_galore
  - fail_trimmed_samples
  - star
  - salmon
  - featurecounts
  - samtools
  - rseqc

custom_data:
  fail_trimmed_samples:
    section_name: "WARNING: Fail Trimming Check"
    description: "List of samples that failed the minimum trimmed reads threshold specified via the '--min_trimmed_reads' parameter. These samples have still been used downstream but should be examined further."
    plot_type: "table"
    pconfig:
      id: "fail_trimmed_samples_table"
      table_title: "Samples failed trimming threshold"
      namespace: "Samples failed trimming threshold"
      format: "{:.0f}"
  fail_strand_check:
    section_name: "Strandedness Checks"
    description: "<p>The strandedness used for analysis can either be provided by the user or automatically inferred by <b>Salmon</b> using a sample of reads ('auto'). In both cases, with <code>--strand_check</code>, strandedness is verified using <b>RSeQC</b>'s <a href='http://rseqc.sourceforge.net/#infer-experiment-py'>infer_experiment.py</a> on genomic alignments. In this table, a pass indicates a match between the supplied strandedness (or that inferred by Salmon) and RSeQC results. A fail indicates a mismatch or 'undetermined' strandedness. 'Undetermined' strandedness can signal QC issues, including potential genomic DNA contamination.</p><p><b>Note:</b> Rows are duplicated for an 'auto' setting to allow comparison of statistics between inference methods.</p>"
    plot_type: "table"
    pconfig:
      id: "fail_strand_check_table"
      title: "Samples strandedness check"
      namespace: "Samples strandedness check"
    headers:
      Status:
        description: Pass if the strandedness inferred by RSeQC matches that provided by the user or predicted by Salmon. Fail otherwise.
      Strand inference method:
        description: Tool used to detect strandedness
      Provided strandedness:
        description: User-provided strandedness
      Inferred strandedness:
        description: Inferred strandedness
      Sense (%):
        max: 100
      Antisense (%):
        max: 100
      Unstranded (%):
        max: 100
