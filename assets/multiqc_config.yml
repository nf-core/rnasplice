report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/rnasplice/tree/dev" target="_blank">nf-core/rnasplice</a> analysis pipeline. For information about how to interpret these results, please see the <a href="https://nf-co.re/rnasplice/dev/docs/output" target="_blank">documentation</a>.
report_section_order:
  "nf-core-rnasplice-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-rnasplice-summary":
    order: -1002

export_plots: true
disable_version_detection: true

extra_fn_clean_exts:
  - "_sorted"

# Order of modules
top_modules:
  - "fail_trimmed_samples"
  - "fail_strand_check"

# Order of modules
module_order:
  - fastqc
  - trim_galore
  - fail_trimmed_samples
  - star
  - salmon
  - featurecounts
  - samtools
  - rseqc
  - rmats
  - splicing_sample_metrics
  - differential_splicing

custom_data:
  fail_trimmed_samples:
    section_name: "WARNING: Fail Trimming Check"
    description: "List of samples that failed the minimum trimmed reads threshold specified via the '--min_trimmed_reads' parameter. These samples have still been used downstream but should be examined further."
    plot_type: "table"
    pconfig:
      id: "fail_trimmed_samples_table"
      table_title: "Samples failed trimming threshold"
      namespace: "Samples failed trimming threshold"
      format: "{:.0f}"
  fail_strand_check:
    section_name: "Strandedness Checks"
    description: "<p>The strandedness used for analysis can either be provided by the user or automatically inferred by <b>Salmon</b> using a sample of reads ('auto'). In both cases, with <code>--strand_check</code>, strandedness is verified using <b>RSeQC</b>'s <a href='http://rseqc.sourceforge.net/#infer-experiment-py'>infer_experiment.py</a> on genomic alignments. In this table, a pass indicates a match between the supplied strandedness (or that inferred by Salmon) and RSeQC results. A fail indicates a mismatch or 'undetermined' strandedness. 'Undetermined' strandedness can signal QC issues, including potential genomic DNA contamination.</p><p><b>Note:</b> Rows are duplicated for an 'auto' setting to allow comparison of statistics between inference methods.</p>"
    plot_type: "table"
    pconfig:
      id: "fail_strand_check_table"
      title: "Samples strandedness check"
      namespace: "Samples strandedness check"
    headers:
      Status:
        description: Pass if the strandedness inferred by RSeQC matches that provided by the user or predicted by Salmon. Fail otherwise.
      Strand inference method:
        description: Tool used to detect strandedness
      Provided strandedness:
        description: User-provided strandedness
      Inferred strandedness:
        description: Inferred strandedness
      Sense (%):
        max: 100
      Antisense (%):
        max: 100
      Unstranded (%):
        max: 100
  leafcutter_junction_strands:
    section_name: "LeafCutter Junction Strands"
    description: "<p>LeafCutter clusters only junctions with a strand. For unstranded samples the strand comes from the aligner <code>XS</code> tag where regtools finds one, otherwise from the splice motif in the genome, and otherwise from the annotation. Junctions that get a strand from none of these are discarded by the clustering without a message. This table shows, per sample, how many junctions, and how many of the reads spanning them, each route gave a strand to and how many were left strandless. Stranded samples take the strand from the read orientation, so they have no row here.</p>"
    plot_type: "table"
    pconfig:
      id: "leafcutter_junction_strands_table"
      title: "LeafCutter junction strands"
      namespace: "LeafCutter junction strands"
    headers:
      Junctions:
        description: Junctions regtools found in the sample
        format: "{:,.0f}"
      Junctions already stranded (XS):
        description: Junctions stranded by the aligner XS tag
        format: "{:,.0f}"
        hidden: true
      Junctions stranded by motif:
        description: Junctions stranded by their canonical splice motif
        format: "{:,.0f}"
        hidden: true
      Junctions stranded by annotation:
        description: Junctions stranded by an annotated intron with a non-canonical motif
        format: "{:,.0f}"
        hidden: true
      Junctions strandless:
        description: Junctions left without a strand
        format: "{:,.0f}"
      Junctions strandless (%):
        description: Percentage of the junctions left without a strand, which the clustering discards
        min: 0
        max: 100
        scale: "OrRd"
        suffix: "%"
      Reads:
        description: Reads spanning the junctions
        format: "{:,.0f}"
      Reads already stranded (XS):
        description: Reads spanning junctions stranded by the aligner XS tag
        format: "{:,.0f}"
        hidden: true
      Reads stranded by motif:
        description: Reads spanning junctions stranded by their splice motif
        format: "{:,.0f}"
        hidden: true
      Reads stranded by annotation:
        description: Reads spanning junctions stranded by the annotation
        format: "{:,.0f}"
        hidden: true
      Reads strandless:
        description: Reads spanning junctions left without a strand
        format: "{:,.0f}"
      Reads strandless (%):
        description: Percentage of the reads left without a strand, which the clustering discards
        min: 0
        max: 100
        scale: "OrRd"
        suffix: "%"
  splicing_sample_metrics:
    plot_type: "generalstats"
    headers:
      dexseq_exon_bins_detected:
        title: "Exon Bins Detected"
        namespace: "DEXSeq"
        description: "Percentage of the DEXSeq exon bins with at least one read in the sample, computed by the pipeline from the DEXSeq count table of the sample"
        suffix: "%"
        min: 0
        max: 100
        scale: "RdYlGn"
      suppa_events_quantified:
        title: "Events Quantified"
        namespace: "SUPPA2"
        description: "Percentage of the SUPPA2 local splicing events with a PSI value in the sample, computed by the pipeline from the SUPPA2 PSI matrix. Events without a PSI had no expression of the transcripts that define them"
        suffix: "%"
        min: 0
        max: 100
        scale: "RdYlGn"
      leafcutter_introns_detected:
        title: "Introns Detected"
        namespace: "LeafCutter"
        description: "Percentage of the introns in the LeafCutter clusters with at least one read in the sample, computed by the pipeline from the LeafCutter intron counts"
        suffix: "%"
        min: 0
        max: 100
        scale: "RdYlGn"
  differential_splicing:
    section_name: "Differential Splicing"
    description: "<p>How many features each differential splicing analysis tested, and how many it called significant, for each contrast. The pipeline computes these numbers from the result table of each tool, with the threshold in the last column, which is the pipeline parameter where the tool has one. A feature is counted as tested when the tool reported a p-value or adjusted p-value for it. The route is the quantification the analysis used: STAR for the STAR and Salmon route, Salmon for Salmon pseudo-alignment or Salmon results. Analyses of the genome alignments have no route. rMATS has its own section.</p>"
    plot_type: "table"
    pconfig:
      id: "differential_splicing_table"
      title: "Differential splicing"
      namespace: "Differential splicing"
      col1_header: "Analysis"
      sort_rows: false
    headers:
      Method:
        description: "Tool or combination of tools that tested the features"
      Route:
        description: "Quantification the analysis used, if it depends on one"
      Contrast:
        description: "Contrast from the contrastsheet"
      Unit:
        description: "What the tool tests: events, transcripts, exon bins, genes, clusters or bins"
      Tested:
        description: "Features the tool reported a p-value or adjusted p-value for"
        format: "{:,.0f}"
        scale: false
      Significant:
        description: "Tested features that pass the threshold"
        format: "{:,.0f}"
        scale: "Greens"
      Percent Significant:
        title: "% Significant"
        description: "Percentage of the tested features that pass the threshold"
        suffix: "%"
        min: 0
        max: 100
        scale: "Greens"
      Threshold:
        description: "Threshold a feature must pass to count as significant"
