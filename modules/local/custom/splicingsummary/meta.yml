# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "custom_splicingsummary"
description: Summarise the result tables of the splicing analyses into MultiQC custom content, as per-sample General Statistics columns and one report section per summary, grouped under a Splicing parent section
keywords:
  - splicing
  - multiqc
  - summary
  - differential splicing
tools:
  - "custom":
      description: "Python script, using pandas, that summarises the outputs of DEXSeq, edgeR, DRIMSeq/DEXSeq DTU with stageR, SUPPA2, IsoformSwitchAnalyzeR, LeafCutter, ASpli and rMATS, and the splice junctions of STAR, for MultiQC"
      licence: ["MIT"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing run information
          e.g. `[ id:'splicing_summary' ]`
    - labels:
        type: list
        description: |
          One map per result file, in the order of `results`, with the keys
          `kind` (what the file is, e.g. `dexseq_counts`, `star_log`, `suppa_events`,
          `leafcutter_ds`, `leafcutter_strands`, `rmats_summary`, `rmats_jc`, `contrasts`, `samplesheet`,
          `gene_annotation`), `route` (`STAR`, `Salmon` or empty) and `id` (the sample of
          a per-sample table, the contrast of a result table, or empty)
    - results:
        type: file
        description: |
          Result tables of the splicing analyses: DEXSeq count tables, STAR
          `Log.final.out` files, SUPPA2 PSI matrices and dPSI tables, LeafCutter intron
          counts, junction strand summaries and cluster significance tables, DEXSeq DEU and DTU results and gene
          q-values, edgeR exon and Simes tables, stageR adjusted p-values, the
          IsoformSwitchAnalyzeR isoform features, ASpli bin and junction cluster tables,
          rMATS summaries and JC tables, the contrastsheet, a `sample,condition` CSV and
          the gene annotation table
        pattern: "*.{txt,tsv,csv,psi,dpsi,gz,out}"
        ontologies: []
  - section_config:
      type: file
      description: |
        The text, headers, tool tables and thresholds of the sections, the pipeline's
        assets/multiqc_splicing_sections.yml, filled in with the computed values
      pattern: "*.{yml,yaml}"
      ontologies:
        - edam: http://edamontology.org/format_3750 # YAML
output:
  sections:
    - - meta:
          type: map
          description: |
            Groovy Map containing run information
      - "*_mqc.json":
          type: file
          description: |
            MultiQC custom content, each file written when its inputs are given:
            `splicing_sample_metrics` (General Statistics columns), and the sections
            under the Splicing parent section, `splicing_verdict`,
            `splicing_design_check`, `suppa_psi_concordance`, `differential_splicing`
            (significant features of each analysis and contrast),
            `leafcutter_cluster_test_outcomes`, `suppa_significant_events`,
            `splicing_method_agreement` and `splicing_pvalue_histograms`
          pattern: "*_mqc.json"
          ontologies:
            - edam: http://edamontology.org/format_3464 # JSON
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
