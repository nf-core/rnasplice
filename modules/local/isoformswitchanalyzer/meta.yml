# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "isoformswitchanalyzer"
description: Identify isoform switches between two conditions from Salmon quantifications
  with IsoformSwitchAnalyzeR, adjusting for covariates, predict their functional
  consequences and plot the top switching genes
keywords:
  - IsoformSwitchAnalyzeR
  - isoform switch
  - differential transcript usage
  - alternative splicing
  - salmon
tools:
  - "IsoformSwitchAnalyzeR":
      description: "Analysis of alternative splicing and isoform switches with predicted functional consequences (e.g. gain/loss of protein domains etc.) from quantification of all types of RNASeq by tools such as Kallisto, Salmon, StringTie, Cufflinks/Cuffdiff etc."
      homepage: "https://bioconductor.org/packages/IsoformSwitchAnalyzeR"
      documentation: "https://bioconductor.org/packages/release/bioc/vignettes/IsoformSwitchAnalyzeR/inst/doc/IsoformSwitchAnalyzeR.html"
      tool_dev_url: "https://github.com/kvittingseerup/IsoformSwitchAnalyzeR"
      doi: "10.1093/bioinformatics/btz247"
      licence: ["GPL-2.0-or-later"]
      identifier: biotools:isoformswitchanalyzer

input:
  - - meta:
        type: map
        description: |
          Groovy Map with the contrast, e.g. `[ id:'GBR-YRI' ]`. An optional `blocking` entry
          lists the samplesheet columns, separated by semicolons, to use as covariates of
          the switch test
    - reference:
        type: string
        description: The reference (control) condition of the contrast
    - target:
        type: string
        description: The target (treatment) condition of the contrast
  - - meta2:
        type: map
        description: |
          Groovy Map with the samples, e.g. `[ id:'samples' ]`
    - samplesheet:
        type: file
        description: Comma-separated sample sheet with `sample` and `condition` columns and
          any blocking variables. Only the samples of the two conditions are used
        pattern: "*.csv"
        ontologies:
          - edam: "http://edamontology.org/format_3752" # CSV
    - salmon_output:
        type: directory
        description: One Salmon quant directory per sample, each holding a `quant.sf`.
          The directory names must match the `sample` column of the samplesheet
        pattern: "*"
  - gtf:
      type: file
      description: GTF annotation the transcripts were quantified against
      pattern: "*.gtf"
      ontologies:
        - edam: "http://edamontology.org/format_2306" # GTF
  - transcript_sequences:
      type: file
      description: Nucleotide sequences of the annotated transcripts, named by transcript id as in the GTF
      pattern: "*.{fa,fasta}"
      ontologies:
        - edam: "http://edamontology.org/format_1929" # FASTA
  - alpha:
      type: float
      description: FDR cutoff below which an isoform switch is called significant
  - dIF:
      type: float
      description: Minimum absolute difference in isoform fraction between the two conditions for an isoform switch to be called

output:
  isoformswitchanalyzer_summary:
    - - meta:
          type: map
          description: Groovy Map with the contrast
      - "isoformswitchanalyzer_summary.csv":
          type: file
          description: Number of switching isoforms, switches and genes of the
            contrast. Holds the error message instead when no switch was found
          pattern: "isoformswitchanalyzer_summary.csv"
          ontologies:
            - edam: "http://edamontology.org/format_3752" # CSV
  isoformswitchanalyzer_isoformFeatures:
    - - meta:
          type: map
          description: Groovy Map with the contrast
      - "isoformswitchanalyzer_isoformfeatures.csv":
          type: file
          description: The `isoformFeatures` table of the switchAnalyzeRlist with the
            expression, isoform fraction, switch q-value and consequences of every
            isoform. Empty when no switch was found
          pattern: "isoformswitchanalyzer_isoformfeatures.csv"
          ontologies:
            - edam: "http://edamontology.org/format_3752" # CSV
  switchlist_rds:
    - - meta:
          type: map
          description: Groovy Map with the contrast
      - "switchlist.rds":
          type: file
          description: Serialised switchAnalyzeRlist object
          pattern: "switchlist.rds"
  results:
    - - meta:
          type: map
          description: Groovy Map with the contrast
      - "results":
          type: directory
          description: A subdirectory with a switch plot PDF per switching gene,
            plus the common switch consequences PDF
          pattern: "results"
  versions_isoformswitchanalyzer:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML

topics:
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
