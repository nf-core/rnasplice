# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "dexseq_exon"
description: |
  Differential exon usage analysis using DEXSeq. This module performs differential exon usage analysis using the DEXSeq package in R.
keywords:
  - dexseq
  - differential exon usage
  - rnaseq
  - alternative splicing
tools:
  - "bioconductor-dexseq":
      description: "Inference of differential exon usage in RNA-Seq"
      homepage: "https://bioconductor.org/packages/release/bioc/html/DEXSeq.html"
      documentation: "https://bioconductor.org/packages/release/bioc/html/DEXSeq.html"
      tool_dev_url: "https://github.com/Huber-group-EMBL/DEXSeq"
      doi: "10.18129/B9.bioc.DEXSeq"
      licence: ["GPL >=3"]
      identifier: "biotools:dexseq"

input:
  - "dexseq_clean_counts/*":
      type: file
      description: |
        Exon count tables written by `DEXSEQ_COUNT`, one per sample, staged in
        `dexseq_clean_counts/`. The script reads `<sample>.clean.count.txt` for every
        `sample` of the samplesheet, so the order of the files does not matter
      pattern: "*.clean.count.txt"
      ontologies:
        - edam: "http://edamontology.org/format_3475" # TSV
  - gff:
      type: file
      description: |
        Flattened DEXSeq annotation, as written by `DEXSEQ_ANNOTATION` or supplied with
        `--gff_dexseq`
      pattern: "*.gff"
      ontologies:
        - edam: "http://edamontology.org/format_1975" # GFF3
  - samplesheet:
      type: file
      description: |
        Samplesheet, a CSV file with at least the `sample` and `condition` columns
      pattern: "*.csv"
      ontologies:
        - edam: "http://edamontology.org/format_3752" # CSV
  - contrastsheet:
      type: file
      description: |
        Contrastsheet, a CSV file with the `contrast`, `treatment` and `control`
        columns. The output files are named after the `contrast` column
      pattern: "*.csv"
      ontologies:
        - edam: "http://edamontology.org/format_3752" # CSV
  - ntop:
      type: integer
      description: |
        Number of genes with the lowest p-values to plot for each contrast
      default: 10

output:
  dexseq_exon_dataset_rds:
    - "DEXSeqDataSet.*.rds":
        type: file
        description: DEXSeqDataSet object of each contrast, named after the `contrast` column
        pattern: "DEXSeqDataSet.*.rds"
  dexseq_exon_results_rds:
    - "DEXSeqResults.*.rds":
        type: file
        description: DEXSeqResults object of each contrast, named after the `contrast` column
        pattern: "DEXSeqResults.*.rds"
  dexseq_gene_results_rds:
    - "perGeneQValue.*.rds":
        type: file
        description: Per gene q-values of each contrast, named after the `contrast` column
        pattern: "perGeneQValue.*.rds"
  dexseq_exon_results_csv:
    - "DEXSeqResults.*.csv":
        type: file
        description: Exon level results of each contrast, named after the `contrast` column
        pattern: "DEXSeqResults.*.csv"
        ontologies:
          - edam: "http://edamontology.org/format_3752" # CSV
  dexseq_gene_results_csv:
    - "perGeneQValue.*.csv":
        type: file
        description: Per gene q-values of each contrast, named after the `contrast` column
        pattern: "perGeneQValue.*.csv"
        ontologies:
          - edam: "http://edamontology.org/format_3752" # CSV
  dexseq_plot_results_pdf:
    - "plotDEXSeq.*.pdf":
        type: file
        description: Plots of the genes with the lowest p-values in each contrast, named after the `contrast` column
        pattern: "plotDEXSeq.*.pdf"
        ontologies:
          - edam: "http://edamontology.org/format_3508" # PDF
  versions_R:
    - - ${task.process}:
          type: string
          description: The name of the process
      - r-base:
          type: string
          description: The name of the tool
      - R --version 2>&1 | head -n 1 | sed "s/^.*version //; s/ .*$//":
          type: eval
          description: The expression to obtain the version of the tool
  versions_dexseq:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bioconductor-dexseq:
          type: string
          description: The name of the tool
      - Rscript -e "library(DEXSeq); cat(as.character(packageVersion('DEXSeq')))":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - r-base:
          type: string
          description: The name of the tool
      - R --version 2>&1 | head -n 1 | sed "s/^.*version //; s/ .*$//":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - bioconductor-dexseq:
          type: string
          description: The name of the tool
      - Rscript -e "library(DEXSeq); cat(as.character(packageVersion('DEXSeq')))":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@bensouthgate"
maintainers:
  - "@piplus2"
