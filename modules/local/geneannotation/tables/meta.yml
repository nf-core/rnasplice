# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "geneannotation_tables"
description: Write the gene and transcript annotation tables of a gffread transcript
  table, with the name and biotype of each gene
keywords:
  - annotation
  - gtf
  - gene names
  - genomics
tools:
  - "python":
      description: "Python programming language. The module uses it to read the gffread
        transcript table and write the annotation tables."
      homepage: "https://www.python.org/"
      documentation: "https://docs.python.org/3/"
      tool_dev_url: "https://github.com/python/cpython"
      licence: ["PSF-2.0"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing annotation information
          e.g. `[ id:'genes' ]`
    - tx2gene:
        type: file
        description: |
          Transcript table of the GTF, as `gffread --table` writes it, with no header and
          the columns transcript ID, gene ID, one or more extra attributes of which the
          first is the gene name, `gene_biotype` and `gene_type`. gffread writes `.` for a
          missing attribute
        pattern: "*.tsv"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV

output:
  gene:
    - - meta:
          type: map
          description: |
            Groovy Map containing annotation information
            e.g. `[ id:'genes' ]`
      - "*.gene_annotation.tsv":
          type: file
          description: |
            One row per gene, sorted by gene ID, with the columns `gene_id`, `gene_name`
            and `gene_biotype`. A gene with no name is named by its ID, and a
            gene with no `gene_biotype` or `gene_type` has the biotype `NA`
          pattern: "*.gene_annotation.tsv"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  transcript:
    - - meta:
          type: map
          description: |
            Groovy Map containing annotation information
            e.g. `[ id:'genes' ]`
      - "*.transcript_annotation.tsv":
          type: file
          description: |
            One row per transcript, sorted by transcript ID, with the columns
            `transcript_id`, `gene_id`, `gene_name` and `gene_biotype`
          pattern: "*.transcript_annotation.tsv"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  versions_python:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@piplus2"
maintainers:
  - "@piplus2"
